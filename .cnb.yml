main:
  push:
    - name: build-windows-exe
      docker:
        image: electronuserland/builder:wine
      env:
        ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      stages:
        - name: install
          script: |
            corepack enable
            corepack prepare pnpm@10.33.2 --activate
            pnpm install --frozen-lockfile=false
        - name: test
          script: |
            apt-get update -qq
            apt-get install -y -qq libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libpango-1.0-0 libcairo2 libnss3 libnspr4 libxss1 libgtk-3-0 libxtst6
            export ELECTRON_DISABLE_SANDBOX=1
            pnpm run test
        - name: package-win
          script: |
            pnpm run dist:win
        - name: list-output
          script: |
            ls -lh dist/*.exe
        - name: upload-artifact
          image: cnbcool/attachments:latest
          settings:
            commit: $CNB_COMMIT
            attachments:
              - dist/*.exe

